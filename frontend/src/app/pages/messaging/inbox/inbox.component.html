<div class="container">
  <h1>Messages</h1>

  <div *ngIf="loading" class="hint">Loading…</div>
  <div *ngIf="error" class="hint error">Could not load your conversations.</div>

  <ng-container *ngIf="!loading && !error">
    <div *ngIf="!items.length" class="empty">
      <mat-icon>chat</mat-icon>
      <div>No conversations yet</div>
      <a mat-stroked-button color="primary" routerLink="/properties">
        Explore stays
      </a>
    </div>

    <div *ngIf="items.length" class="list">
      <button class="row" *ngFor="let c of items; trackBy: trackId" (click)="openThread(c)">
        <img class="thumb" [src]="c.propertyCoverUrl || 'assets/placeholder.webp'" alt="" />
        <div class="info">
          <div class="title">{{ c.propertyTitle }}</div>
          <div class="meta">
            <mat-icon>person</mat-icon>{{ c.otherUserEmail }}
            <span class="dot">•</span>
            <mat-icon>schedule</mat-icon>{{ c.lastMessageAt | date:'short' }}
          </div>
          <div class="preview" *ngIf="c.lastMessagePreview">{{ c.lastMessagePreview }}</div>
        </div>
        <span class="badge" *ngIf="c.unreadCount > 0">{{ c.unreadCount }}</span>
      </button>
    </div>
  </ng-container>
</div>
