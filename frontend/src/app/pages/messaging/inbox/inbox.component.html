<div class="container">
  <h1>Inbox</h1>

  <!-- Tabs with counters -->
  <nav class="tabs" role="tablist" aria-label="Inbox filters">
    <button role="tab" class="tab" [class.active]="view==='all'" (click)="view='all'">
      All <span class="pill">{{ countAll }}</span>
    </button>
    <button role="tab" class="tab" [class.active]="view==='unread'" (click)="view='unread'">
      Unread <span class="pill" [class.warn]="countUnread>0">{{ countUnread }}</span>
    </button>
    <button role="tab" class="tab" [class.active]="view==='archived'" (click)="view='archived'">
      Archived <span class="pill">{{ countArchived }}</span>
    </button>
  </nav>

  <!-- Loading skeleton -->
  <div class="skeleton" *ngIf="loading">
    <div class="sk-row" *ngFor="let _ of [1,2,3,4]"></div>
  </div>

  <!-- Error -->
  <div class="hint error" *ngIf="!loading && error">
    Could not load your conversations.
  </div>

  <!-- Empty -->
  <div class="empty" *ngIf="!loading && !error && items.length === 0">
    <mat-icon>mark_chat_unread</mat-icon>
    <div>No conversations yet</div>
    <a mat-stroked-button color="primary" routerLink="/properties">Explore stays</a>
  </div>

  <!-- Sections -->
  <div *ngIf="!loading && !error && groupedDisplayed.length">
    <section class="section" *ngFor="let s of groupedDisplayed">
      <header class="section-head" *ngIf="s.label">{{ s.label }}</header>

      <div class="list" role="list" tabindex="0" (keydown)="onListKeydown($event)" aria-label="Conversation list">
        <button
          class="row"
          role="listitem"
          *ngFor="let c of s.items; let i = index"
          (click)="openThread(c)"
          [class.unread]="c.unreadCount > 0"
          [class.active]="(s.offset + i) === activeIndex"
          [class.pinned]="c.pinned === true"
          [attr.aria-label]="'Open conversation ' + c.propertyTitle + ' with ' + c.otherUserEmail"
        >
          <img class="thumb" [src]="c.propertyCoverUrl || placeholder" [alt]="c.propertyTitle" (error)="imgError($event)"/>

          <div class="info">
            <div class="title">
              <span class="name">{{ c.propertyTitle }}</span>
              <span class="chip chip--booking" *ngIf="c.hasBooking">Booking</span>
              <span class="chip chip--general" *ngIf="!c.hasBooking">General</span>
              <span class="chip chip--pin" *ngIf="c.pinned === true">Pinned</span>
            </div>

            <div class="meta">
              <mat-icon>person</mat-icon>{{ c.otherUserEmail }}
              <span class="dot">·</span>
              <ng-container *ngIf="c.lastMessageAt as d">
                <time class="time" [attr.datetime]="d | date:'yyyy-MM-ddTHH:mm:ss'" [attr.title]="d | date:'medium'">
                  {{ d | ago }}
                </time>
              </ng-container>
            </div>

            <!-- Booking line -->
            <div class="booking" *ngIf="c.hasBooking">
              <mat-icon>event</mat-icon>

              <span class="dates">{{ dateRangeShort(c.checkIn, c.checkOut) }}</span>

              <span class="dot" *ngIf="nights(c.checkIn, c.checkOut) as n">·</span>
              <span class="nights" *ngIf="nights(c.checkIn, c.checkOut) as n">{{ n }} nights</span>

              <span class="dot" *ngIf="c.totalPrice != null">·</span>
              <span class="price" *ngIf="c.totalPrice != null">{{ formatMoney(c.totalPrice, c.currency || 'EUR') }}</span>

              <span class="dot" *ngIf="c.bookingStatus">·</span>
              <span class="chip chip-status" *ngIf="c.bookingStatus" [ngClass]="statusClass(c.bookingStatus)">
                {{ statusLabel(c.bookingStatus) }}
              </span>

              <span class="soon" *ngIf="isSoon(c)">Soon</span>
            </div>

            <div class="preview" [title]="c.preview">{{ c.preview }}</div>
          </div>

          <!-- Right side: unread badge + quick actions -->
          <div class="side">
            <div class="badge unread" *ngIf="c.unreadCount > 0">{{ c.unreadCount }}</div>

            <div class="actions">
              <button mat-icon-button (click)="$event.stopPropagation(); toggleUnread(c)" [attr.aria-label]="c.unreadCount>0 ? 'Mark as read' : 'Mark as unread'">
                <mat-icon>{{ c.unreadCount>0 ? 'mark_email_read' : 'mark_email_unread' }}</mat-icon>
              </button>
              <button mat-icon-button (click)="$event.stopPropagation(); togglePin(c)" aria-label="Pin">
                <mat-icon>push_pin</mat-icon>
              </button>
              <button mat-icon-button *ngIf="c.status!=='ARCHIVED'" (click)="$event.stopPropagation(); archiveThread(c)" aria-label="Archive">
                <mat-icon>archive</mat-icon>
              </button>
              <button mat-icon-button *ngIf="c.status==='ARCHIVED'" (click)="$event.stopPropagation(); unarchiveThread(c)" aria-label="Unarchive">
                <mat-icon>unarchive</mat-icon>
              </button>
            </div>
          </div>
        </button>
      </div>
    </section>
  </div>
</div>
