<mat-toolbar class="topbar">
  <div class="dl-container bar">
    <a class="brand" routerLink="/">
      <span class="emoji">🏠</span><strong>DirectLoc</strong>
    </a>

    <span class="spacer"></span>

    <!-- Accesos rápidos visibles cuando hay sesión -->
    <ng-container *ngIf="isLoggedIn">
      <!-- Calendario (icono rápido) -->
      <button
        mat-icon-button
        routerLink="/calendar"
        aria-label="Open calendar"
        matTooltip="Calendar">
        <mat-icon>calendar_month</mat-icon>
      </button>

      <!-- Inbox -->
      <button
        mat-icon-button
        routerLink="/messages"
        aria-label="Open inbox"
        [matBadge]="(unread$ | async) ?? 0"
        [matBadgeHidden]="((unread$ | async) ?? 0) === 0"
        matBadgeColor="accent"
        matBadgeOverlap="false"
        matTooltip="Inbox">
        <mat-icon>mail</mat-icon>
      </button>
    </ng-container>

    <!-- CTA -->
    <button mat-raised-button color="primary" class="dl-btn-pill cta" (click)="goCreate()">
      <mat-icon>add_home</mat-icon>
      <span>List your property</span>
    </button>

    <!-- Menú -->
    <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Open menu">
      <mat-icon>menu</mat-icon>
    </button>

    <mat-menu #menu="matMenu">
      <ng-container *ngIf="isLoggedIn; else guest">

        <!-- ✅ Calendar: usar (click) + matMenuClose. Recarga si ya estás en /calendar -->
        <button mat-menu-item (click)="openCalendar()" matMenuClose>
          <mat-icon>calendar_month</mat-icon><span>Calendar</span>
        </button>

        <button mat-menu-item routerLink="/messages" matMenuClose>
          <mat-icon>mail</mat-icon><span>Inbox</span>
        </button>

        <button mat-menu-item routerLink="/my-properties" matMenuClose>
          <mat-icon>home_work</mat-icon><span>My properties</span>
        </button>

        <button mat-menu-item routerLink="/properties" matMenuClose>
          <mat-icon>search</mat-icon><span>Explore stays</span>
        </button>

        <button mat-menu-item routerLink="/profile" matMenuClose>
          <mat-icon>person</mat-icon><span>My profile</span>
        </button>

        <mat-divider></mat-divider>

        <button mat-menu-item (click)="logout()" matMenuClose>
          <mat-icon>logout</mat-icon><span>Logout</span>
        </button>
      </ng-container>

      <ng-template #guest>
        <button mat-menu-item routerLink="/login" matMenuClose>
          <mat-icon>login</mat-icon><span>Login</span>
        </button>
        <button mat-menu-item routerLink="/register" matMenuClose>
          <mat-icon>person_add</mat-icon><span>Register</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="goCreate()" matMenuClose>
          <mat-icon>add_home</mat-icon><span>List your property</span>
        </button>
      </ng-template>
    </mat-menu>
  </div>
</mat-toolbar>
