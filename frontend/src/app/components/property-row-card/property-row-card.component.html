<div class="row-card" (click)="go()" *ngIf="!loading; else skeleton" [attr.aria-label]="data.title || 'Property row card'">
  <div class="media">
    <img [src]="data.coverUrl || placeholder" [alt]="data.title || 'Property cover image'" loading="lazy" decoding="async" />
    <div class="badge" *ngIf="data.maxGuests">
      {{ guestsBadge }}
    </div>
  </div>

  <div class="info">
    <div class="title">{{ data.title }}</div>

    <div class="sub">
      <mat-icon>location_on</mat-icon>
      {{ displayLocation }}
    </div>

    <div class="meta">
      <span *ngIf="data.bedrooms != null">{{ data.bedrooms }} bd</span>
      <span *ngIf="data.bathrooms != null">• {{ data.bathrooms }} ba</span>
    </div>
  </div>

  <div class="side">
    <div class="price" aria-label="Price per night">
      <span class="amount">
        {{ data.pricePerNight | currency:currencyCode:'symbol':'1.0-0' }}
      </span>
      <span class="per">/ night</span>
    </div>

    <button mat-stroked-button color="primary" (click)="$event.stopPropagation(); go()">
      More details
    </button>
  </div>
</div>

<ng-template #skeleton>
  <div class="row-card skeleton" aria-hidden="true">
    <div class="media"></div>
    <div class="info">
      <div class="line"></div>
      <div class="line short"></div>
    </div>
    <div class="side"><div class="line tiny"></div></div>
  </div>
</ng-template>
