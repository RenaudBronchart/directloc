<!-- confirm-dialog.component.html -->
<h2 mat-dialog-title>{{ title }}</h2>

<div mat-dialog-content>
  <p>{{ message }}</p>
</div>

<div mat-dialog-actions align="end">
  <button
    mat-button
    (click)="close(false)"
    #cancelBtn
  >
    {{ cancelText }}
  </button>

  <button
    mat-raised-button
    [color]="color"
    (click)="close(true)"
    #confirmBtn
  >
    {{ confirmText }}
  </button>
</div>
